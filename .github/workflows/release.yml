name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    uses: wezzcoetzee/.github/.github/workflows/macos-release.yml@main
    with:
      setup-command: brew install xcodegen
      build-command: ./scripts/build-dmg.sh "$VERSION"
      artifacts: dist/*.dmg
